<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Map the Windows / Office Arabic fonts to metric-close free fonts so Word
     documents written on Windows render with proper Arabic shaping -->
<fontconfig>
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Sakkal Majalla</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Andalus</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Arabic Transparent</family><prefer><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Dubai</family><prefer><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Noto Sans</family><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <!-- complex-script fallback for any font without Arabic glyphs -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="append"><string>Noto Naskh Arabic</string></edit>
  </match>
</fontconfig>
